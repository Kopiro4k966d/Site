<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crysea — партнёры</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap&subset=cyrillic" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="acc" style="padding-top:48px;padding-bottom:80px">
  <h1 style="max-width:none;text-align:left;font-size:clamp(2rem,5vw,3rem)">Партнёры</h1>
  <p class="sub">Перед активацией проверьте канал. Статус «Активен» сохранится только при 500 подписчиках и 2 000 средних просмотрах.</p>

  <section id="login" class="card" style="max-width:420px;margin-top:24px">
    <label class="f"><span>Ключ администратора (ADMIN_KEY)</span><input id="key" type="password" autocomplete="off"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="btn p w" id="go" type="button">Войти</button>
  </section>

  <section id="panel" hidden>
    <div class="msg" id="msg" role="status"></div>
    <div id="list" class="adm-list"></div>
  </section>
</main>
<script src="admin.js"></script>
</body>
</html>
